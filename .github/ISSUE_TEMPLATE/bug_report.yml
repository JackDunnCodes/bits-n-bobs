
name: Bug report
description: For problems and errors
labels: bug
assignees: JackDunnCodes
body:
- type: input
  id: which
  attributes:
    label: Which file/project is this issue related to?
    description: "There's multiple projects in this repo. I need to know what one you're using"
    placeholder: "e.g. moreuniqid.php, onlinephp-autologin.user.js"
  validations:
    required: true
- type: textarea
  id: describe
  attributes:
    label: Describe the bug
    description: "A clear and concise description of what the bug is."
  validations:
    required: true
- type: textarea
  id: describe
  attributes:
    label: Reproduction steps
    description: "How can I reproduce the bug? Provide a step-by-step guide on how you got the problem."
    value: "1."
    render: md
  validations:
    required: true
